<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Частный ПК Мастер Иван | Отзывы и Вопросы</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; padding: 20px; padding-bottom: 60px; position: relative; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 20px; padding: 15px 0; border-bottom: 1px solid #1e293b; }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 5px; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; }
    
    /* Табы (вкладки) */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #1e293b; }
    .tab-btn { flex: 1; padding: 12px; background: #1e293b; color: #94a3b8; border: none; border-radius: 8px 8px 0 0; font-weight: bold; cursor: pointer; text-align: center; font-size: 1rem; transition: 0.2s; }
    .tab-btn.active { background: #0284c7; color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .rating-summary { background: #1e293b; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .score { font-size: 2.5rem; font-weight: bold; color: #facc15; }
    
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    h2 { margin-bottom: 15px; color: #38bdf8; font-size: 1.3rem; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    textarea { resize: vertical; height: 80px; }
    
    .stars-select { display: flex; gap: 8px; font-size: 1.8rem; cursor: pointer; color: #475569; justify-content: center; margin: 5px 0; }
    .stars-select span.active { color: #facc15; }
    
    button.submit-btn { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button.submit-btn:hover { background: #0369a1; }
    
    /* Элемент отзыва / вопроса */
    .review-item { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #0284c7; }
    .review-header { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 5px; }
    .review-author { font-weight: bold; color: #f8fafc; font-size: 0.95rem; }
    .review-service { font-size: 0.75rem; color: #38bdf8; background: #1e293b; padding: 2px 6px; border-radius: 4px; }
    .review-stars { color: #facc15; font-size: 0.9rem; }
    .review-text { color: #cbd5e1; font-size: 0.95rem; margin-top: 5px; }
    .review-date { font-size: 0.7rem; color: #64748b; margin-top: 6px; text-align: right; }

    .review-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .review-photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #334155; }

    /* Лайки и Коментарии */
    .action-bar { display: flex; gap: 15px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid #1e293b; }
    .like-btn { background: transparent; border: 1px solid #334155; color: #facc15; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
    .like-btn:hover { background: #1e293b; }
    
    .comments-section { margin-top: 10px; padding-left: 15px; border-left: 2px solid #334155; }
    .comment-item { background: #1e293b; padding: 8px 12px; border-radius: 6px; margin-top: 6px; font-size: 0.85rem; }
    .comment-item.master { border: 1px solid #0284c7; background: #0c2a4a; }
    .comment-author { font-weight: bold; color: #38bdf8; margin-bottom: 2px; }
    .comment-author.master { color: #38bdf8; display: flex; align-items: center; gap: 4px; }
    
    .comment-form { display: flex; gap: 8px; margin-top: 8px; }
    .comment-form input { padding: 6px 10px; font-size: 0.85rem; }
    .comment-form button { padding: 6px 12px; background: #0284c7; border: none; color: white; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    /* Дату обновления сайта вправо вниз */
    footer { position: fixed; bottom: 10px; right: 15px; font-size: 0.75rem; color: #64748b; background: rgba(15, 23, 42, 0.8); padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Частный ПК Мастер</h1>
      <p class="subtitle">Отзывы и ответы на вопросы клиентов</p>
    </header>

    <!-- Переключение вкладок -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('reviews-tab')">Отзывы</button>
      <button class="tab-btn" onclick="switchTab('questions-tab')">Вопросы</button>
    </div>

    <!-- Вкладка: Отзывы -->
    <div id="reviews-tab" class="tab-content active">
      <div class="rating-summary">
        <div>Средняя оценка клиентов</div>
        <div class="score" id="avg-score">0.0</div>
        <div id="total-reviews" style="color: #94a3b8; font-size: 0.8rem;">На основе 0 отзывов</div>
      </div>

      <div class="card">
        <h2>Оставить отзыв</h2>
        <form id="review-form">
          <div class="form-group">
            <label for="name">Ваше имя</label>
            <input type="text" id="name" placeholder="Сергей Юрьевич" required>
          </div>

          <div class="form-group">
            <label for="service">Оказанная услуга</label>
            <select id="service" required>
              <option value="Сборка ПК">Сборка ПК</option>
              <option value="Чистка и замена термопасты">Чистка и замена термопасты</option>
              <option value="Диагностика / Ремонт">Диагностика / Ремонт</option>
              <option value="Настройка ПО / Windows">Настройка ПО / Windows</option>
              <option value="Апгрейд">Апгрейд компонентов</option>
              <option value="Консультация">Консультация</option>
            </select>
          </div>

          <div class="form-group">
            <label style="text-align: center; display: block;">Ваша оценка</label>
            <div class="stars-select" id="star-picker">
              <span data-val="1">★</span>
              <span data-val="2">★</span>
              <span data-val="3">★</span>
              <span data-val="4">★</span>
              <span data-val="5" class="active">★</span>
            </div>
          </div>

          <div class="form-group">
            <label for="photos">Прикрепить фото (до 8 штук)</label>
            <input type="file" id="photos" accept="image/*" multiple>
          </div>

          <div class="form-group">
            <label for="comment">Ваш комментарий</label>
            <textarea id="comment" placeholder="Напишите всё, что думаете..." required></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">Отправить отзыв</button>
        </form>
      </div>

      <div class="card">
        <h2>Отзывы клиентов</h2>
        <div id="reviews-list">Загрузка отзывов...</div>
      </div>
    </div>

    <!-- Вкладка: Вопросы -->
    <div id="questions-tab" class="tab-content">
      <div class="card">
        <h2>Задать вопрос мастеру</h2>
        <form id="question-form">
          <div class="form-group">
            <label for="q-name">Ваше имя</label>
            <input type="text" id="q-name" placeholder="Александр" required>
          </div>
          <div class="form-group">
            <label for="q-text">Ваш вопрос</label>
            <textarea id="q-text" placeholder="Сколько стоит сборка из моих комплектующих?" required></textarea>
          </div>
          <button type="submit" class="submit-btn" id="q-submit-btn">Задать вопрос</button>
        </form>
      </div>

      <div class="card">
        <h2>Вопросы и ответы</h2>
        <div id="questions-list">Загрузка вопросов...</div>
      </div>
    </div>
  </div>

  <footer>Обновлено: 16.08.2026</footer>

  <script>
    const SUPABASE_URL = 'https://xdjgvghxjsilhfbejwac.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_aXFhoRBBdEcaYWOX14UUhQ_3gUadcQ4';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedRating = 5;

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // Звезды
    const stars = document.querySelectorAll('#star-picker span');
    stars.forEach((star, idx) => {
      star.addEventListener('click', () => {
        selectedRating = idx + 1;
        stars.forEach((s, i) => s.classList.toggle('active', i <= idx));
      });
    });

    // Загрузка отзывов
    async function loadReviews() {
      const { data: reviews, error } = await db.from('reviews').select('*').order('created_at', { ascending: false });
      const { data: comments } = await db.from('comments').select('*').order('created_at', { ascending: true });

      if (error) {
        document.getElementById('reviews-list').innerText = 'Ошибка загрузки отзывов.';
        return;
      }

      if (reviews && reviews.length > 0) {
        const avg = (reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length).toFixed(1);
        document.getElementById('avg-score').innerText = avg;
        document.getElementById('total-reviews').innerText = `На основе ${reviews.length} отзывов`;

        document.getElementById('reviews-list').innerHTML = reviews.map(r => {
          let photosHtml = (r.photos && r.photos.length > 0) 
            ? '<div class="review-photos">' + r.photos.map(url => `<a href="${url}" target="_blank"><img src="${url}"></a>`).join('') + '</div>' 
            : '';

          const reviewComments = (comments || []).filter(c => c.review_id === r.id);
          let commentsHtml = reviewComments.map(c => `
            <div class="comment-item ${c.is_master ? 'master' : ''}">
              <div class="comment-author ${c.is_master ? 'master' : ''}">${c.is_master ? '🛠️ Мастер Иван' : escapeHtml(c.author)}</div>
              <div>${escapeHtml(c.text)}</div>
            </div>
          `).join('');

          return `
            <div class="review-item">
              <div class="review-header">
                <div>
                  <span class="review-author">${escapeHtml(r.name)}</span>
                  <span class="review-service">${escapeHtml(r.service)}</span>
                </div>
                <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              </div>
              <div class="review-text">${escapeHtml(r.comment)}</div>
              ${photosHtml}
              <div class="action-bar">
                <button class="like-btn" onclick="addLike(${r.id}, ${r.likes || 0})">👍 ${r.likes || 0}</button>
              </div>
              <div class="comments-section">
                ${commentsHtml}
                <form class="comment-form" onsubmit="addComment(event, ${r.id})">
                  <input type="text" placeholder="Ваше имя" class="c-author" required style="width: 30%;">
                  <input type="text" placeholder="Написать комментарий..." class="c-text" required style="width: 50%;">
                  <button type="submit">Ответить</button>
                </form>
              </div>
              <div class="review-date">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
            </div>
          `;
        }).join('');
      } else {
        document.getElementById('reviews-list').innerText = 'Отзывов пока нет.';
      }
    }

    // Лайк
    async function addLike(id, currentLikes) {
      await db.from('reviews').update({ likes: currentLikes + 1 }).eq('id', id);
      loadReviews();
    }

    // Комментарий к отзыву
    async function addComment(e, reviewId) {
      e.preventDefault();
      const form = e.target;
      const author = form.querySelector('.c-author').value;
      const text = form.querySelector('.c-text').value;
      const isMaster = author.toLowerCase().includes('мастер') || author.toLowerCase().includes('иван');

      await db.from('comments').insert([{ review_id: reviewId, author, text, is_master: isMaster }]);
      loadReviews();
    }

    // Загрузка вопросов
    async function loadQuestions() {
      const { data: qList } = await db.from('questions').select('*').order('created_at', { ascending: false });
      const { data: comments } = await db.from('comments').select('*').order('created_at', { ascending: true });

      if (!qList || qList.length === 0) {
        document.getElementById('questions-list').innerText = 'Вопросов пока нет. Будьте первым!';
        return;
      }

      document.getElementById('questions-list').innerHTML = qList.map(q => {
        const qComments = (comments || []).filter(c => c.review_id === (q.id * -1)); // Использование отрицательных ID для вопросов
        let commentsHtml = qComments.map(c => `
          <div class="comment-item ${c.is_master ? 'master' : ''}">
            <div class="comment-author ${c.is_master ? 'master' : ''}">${c.is_master ? '🛠️ Мастер Иван' : escapeHtml(c.author)}</div>
            <div>${escapeHtml(c.text)}</div>
          </div>
        `).join('');

        return `
          <div class="review-item" style="border-left-color: #facc15;">
            <div class="review-author">${escapeHtml(q.name)}</div>
            <div class="review-text">${escapeHtml(q.question)}</div>
            <div class="comments-section">
              ${commentsHtml}
              <form class="comment-form" onsubmit="addQuestionComment(event, ${q.id})">
                <input type="text" placeholder="Ваше имя" class="c-author" required style="width: 30%;">
                <input type="text" placeholder="Ответить..." class="c-text" required style="width: 50%;">
                <button type="submit">Ответить</button>
              </form>
            </div>
            <div class="review-date">${new Date(q.created_at).toLocaleDateString('ru-RU')}</div>
          </div>
        `;
      }).join('');
    }

    // Комментарий к вопросу
    async function addQuestionComment(e, qId) {
      e.preventDefault();
      const form = e.target;
      const author = form.querySelector('.c-author').value;
      const text = form.querySelector('.c-text').value;
      const isMaster = author.toLowerCase().includes('мастер') || author.toLowerCase().includes('иван');

      await db.from('comments').insert([{ review_id: (qId * -1), author, text, is_master: isMaster }]);
      loadQuestions();
    }

    // Отправка вопроса
    document.getElementById('question-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('q-name').value;
      const question = document.getElementById('q-text').value;

      await db.from('questions').insert([{ name, question }]);
      document.getElementById('question-form').reset();
      loadQuestions();
    });

    // Отправка отзыва
    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      const name = document.getElementById('name').value;
      const service = document.getElementById('service').value;
      const comment = document.getElementById('comment').value;
      const fileInput = document.getElementById('photos');
      const files = Array.from(fileInput.files).slice(0, 8);
      const photoUrls = [];

      for (const file of files) {
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}_${file.name}`;
        const { error } = await db.storage.from('review-photos').upload(fileName, file);
        if (!error) {
          const { data } = db.storage.from('review-photos').getPublicUrl(fileName);
          if (data) photoUrls.push(data.publicUrl);
        }
      }

      await db.from('reviews').insert([{ name, service, rating: selectedRating, comment, photos: photoUrls }]);
      document.getElementById('review-form').reset();
      btn.disabled = false;
      loadReviews();
    });

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadReviews();
    loadQuestions();
  </script>
</body>
</html>
