<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Частный ПК Мастер Иван | Отзывы и Книга Жалоб</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 30px; padding: 15px 0; border-bottom: 1px solid #1e293b; }
    h1 { color: #38bdf8; font-size: 1.8rem; margin-bottom: 5px; }
    .subtitle { color: #94a3b8; font-size: 0.9rem; }
    
    .rating-summary { background: #1e293b; padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
    .score { font-size: 2.5rem; font-weight: bold; color: #facc15; }
    
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    h2 { margin-bottom: 15px; color: #38bdf8; font-size: 1.3rem; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
    textarea { resize: vertical; height: 80px; }
    
    /* Стили для загрузки фото */
    .file-input-wrapper { position: relative; }
    input[type="file"] { background: #0f172a; padding: 8px; font-size: 0.85rem; }
    .file-hint { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
    
    .stars-select { display: flex; gap: 8px; font-size: 1.8rem; cursor: pointer; color: #475569; justify-content: center; margin: 5px 0; }
    .stars-select span.active { color: #facc15; }
    
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #334155; cursor: not-allowed; }
    
    .review-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #0284c7; }
    .review-header { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 5px; }
    .review-author { font-weight: bold; color: #f8fafc; font-size: 0.95rem; }
    .review-service { font-size: 0.75rem; color: #38bdf8; background: #1e293b; padding: 2px 6px; border-radius: 4px; }
    .review-stars { color: #facc15; font-size: 0.9rem; }
    .review-text { color: #cbd5e1; font-size: 0.9rem; }
    .review-date { font-size: 0.7rem; color: #64748b; margin-top: 6px; text-align: right; }

    /* Галерея фотографий в отзыве */
    .review-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .review-photos img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid #334155; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Частный ПК Мастер</h1>
      <p class="subtitle">Оставьте честный отзыв о моей работе</p>
    </header>

    <div class="rating-summary">
      <div>Средняя оценка клиентов</div>
      <div class="score" id="avg-score">0.0</div>
      <div id="total-reviews" style="color: #94a3b8; font-size: 0.8rem;">На основе 0 отзывов</div>
    </div>

    <div class="card">
      <h2>Оставить отзыв</h2>
      <form id="review-form">
        <div class="form-group">
          <label for="name">Ваше имя</label>
          <input type="text" id="name" placeholder="Сергей Юрьевич" required>
        </div>

        <div class="form-group">
          <label for="service">Оказанная услуга</label>
          <select id="service" required>
            <option value="Сборка ПК">Сборка ПК</option>
            <option value="Чистка и замена термопасты">Чистка и замена термопасты</option>
            <option value="Диагностика / Ремонт">Диагностика / Ремонт</option>
            <option value="Настройка ПО / Windows">Настройка ПО / Windows</option>
            <option value="Апгрейд">Апгрейд компонентов</option>
            <option value="Консультация">Консультация</option>
          </select>
        </div>

        <div class="form-group">
          <label style="text-align: center; display: block;">Ваша оценка</label>
          <div class="stars-select" id="star-picker">
            <span data-val="1">★</span>
            <span data-val="2">★</span>
            <span data-val="3">★</span>
            <span data-val="4">★</span>
            <span data-val="5" class="active">★</span>
          </div>
        </div>

        <!-- Поле прикрепления фото НАД комментариями -->
        <div class="form-group">
          <label for="photos">Прикрепить фото вашей сборки / работы (до 8 штук)</label>
          <input type="file" id="photos" accept="image/*" multiple>
          <div class="file-hint">Можно выбрать несколько фотографий сразу</div>
        </div>

        <div class="form-group">
          <label for="comment">Ваш комментарий (Книга жалоб и предложений)</label>
          <textarea id="comment" placeholder="Напишите всё, что думаете..." required></textarea>
        </div>

        <button type="submit" id="submit-btn">Отправить отзыв</button>
      </form>
    </div>

    <div class="card">
      <h2>Отзывы клиентов</h2>
      <div id="reviews-list">Загрузка отзывов...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xdjgvghxjsilhfbejwac.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_aXFhoRBBdEcaYWOX14UUhQ_3gUadcQ4';
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedRating = 5;

    const stars = document.querySelectorAll('#star-picker span');
    stars.forEach((star, idx) => {
      star.addEventListener('click', () => {
        selectedRating = idx + 1;
        stars.forEach((s, i) => {
          if (i <= idx) s.classList.add('active');
          else s.classList.remove('active');
        });
      });
    });

    async function loadReviews() {
      const { data: reviews, error } = await db
        .from('reviews')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('reviews-list').innerText = 'Не удалось загрузить отзывы: ' + error.message;
        return;
      }

      if (reviews && reviews.length > 0) {
        const avg = (reviews.reduce((acc, r) => acc + r.rating, 0) / reviews.length).toFixed(1);
        document.getElementById('avg-score').innerText = avg;
        document.getElementById('total-reviews').innerText = `На основе ${reviews.length} отзывов`;

        const listHtml = reviews.map(r => {
          // Генерация картинок, если они есть
          let photosHtml = '';
          if (r.photos && Array.isArray(r.photos) && r.photos.length > 0) {
            photosHtml = '<div class="review-photos">' + 
              r.photos.map(url => `<a href="${url}" target="_blank"><img src="${url}" alt="Фото отзыва"></a>`).join('') + 
              '</div>';
          }

          return `
            <div class="review-item">
              <div class="review-header">
                <div>
                  <span class="review-author">${escapeHtml(r.name)}</span>
                  <span class="review-service">${escapeHtml(r.service)}</span>
                </div>
                <div class="review-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
              </div>
              <div class="review-text">${escapeHtml(r.comment)}</div>
              ${photosHtml}
              <div class="review-date">${new Date(r.created_at).toLocaleDateString('ru-RU')}</div>
            </div>
          `;
        }).join('');

        document.getElementById('reviews-list').innerHTML = listHtml;
      } else {
        document.getElementById('avg-score').innerText = '0.0';
        document.getElementById('total-reviews').innerText = 'На основе 0 отзывов';
        document.getElementById('reviews-list').innerText = 'Отзывов пока нет. Будьте первым!';
      }
    }

    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = 'Загрузка...';

      const name = document.getElementById('name').value;
      const service = document.getElementById('service').value;
      const comment = document.getElementById('comment').value;
      const fileInput = document.getElementById('photos');
      const files = Array.from(fileInput.files).slice(0, 8); // Максимум 8 фото

      const photoUrls = [];

      // Загрузка каждого фото в Supabase Storage
      for (const file of files) {
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}_${file.name}`;
        const { data, error } = await db.storage.from('review-photos').upload(fileName, file);

        if (!error) {
          const { data: publicUrlData } = db.storage.from('review-photos').getPublicUrl(fileName);
          if (publicUrlData) photoUrls.push(publicUrlData.publicUrl);
        } else {
          console.error('Ошибка загрузки фото:', error);
        }
      }

      // Сохранение отзыва с массивом ссылок на фото
      const { error } = await db
        .from('reviews')
        .insert([{ name, service, rating: selectedRating, comment, photos: photoUrls }]);

      if (error) {
        alert('Ошибка при отправке: ' + error.message);
      } else {
        alert('Спасибо за отзыв!');
        document.getElementById('review-form').reset();
        stars.forEach(s => s.classList.add('active'));
        selectedRating = 5;
        await loadReviews();
      }

      btn.disabled = false;
      btn.innerText = 'Отправить отзыв';
    });

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    loadReviews();
  </script>
</body>
</html>
